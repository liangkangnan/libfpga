name: crc
bus: apb
addr: 16
data: 32
regs:
  - name: ctrl
    info: Control register
    bits:
      - {b: 0, name: enable, access: rw, info: "1: enable crc module"}
  - name: stat
    info: Status register
    bits:
      - {b: 0, name: idle, access: rf, info: "1: No data is calculating..."}
      - {b: 1, name: fifo_empty, access: rf, info: "1: empty"}
      - {b: 2, name: fifo_full, access: rf, info: "1: full"}
  - name: init
    info: crc init value register
    bits:
      - {b: [31, 0], name: init, access: rw}
  - name: poly
    info: crc poly register
    bits:
      - {b: [31, 0], name: poly, access: rw}
  - name: result
    info: crc result register
    bits:
      - {b: [31, 0], name: result, access: rf}
  - name: data
    info: "Input data FIFO"
    bits:
      - {b: [7, 0], access: wf}
