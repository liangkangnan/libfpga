name: xip
bus: apb
addr: 16
data: 32
regs:
  - name: csr
    info: Control and status register
    bits:
      - {b: 0, name: direct, access: rw, info: "If 1, enable direct mode. Chip
        select is held asserted until direct mode is disabled, and individual
        bytes can be written to TXDATA and then read from RXDATA. If you
        enable direct mode whilst executing from XIP, you're gonna have a bad
        time."}
      - {b: 1, name: busy, access: rov, info: "Reads as 1 when a direct mode
        transfer is in progress. Note a direct mode transfer takes precisely
        16 cycles (in between the APB write and readback, so at least 19
        cycles total), so you could insert a precise delay in your code
        instead of polling this bit."}
      - {b: 2, name: cs_level, access: rw, info: "Control CS pin level when in direct mode."}
  - name: txdata
    info: Direct mode transmit data
    bits:
      - {b: [7, 0], access: wf}
  - name: rxdata
    info: Direct mode receive data
    bits:
      - {b: [7, 0], access: rf}
  - name: qspi_ctrl
    info: QSPI Control register
    bits:
      - {b: 0, name: mode, access: rw, info: "If 1, enable qspi mode when in
        XIP, but not affect direct mode(normal SPI mode)."}
      - {b: [3, 1], name: dummy, access: rw, info: "Dummy cycles after addr phase"}
  - name: clkdiv
    info: SPI clock divider register
    bits:
      - {b: [7, 0], name: div, access: rw, rst: 1, info: "spi clk = core_clock / div / 2"}
  - name: icache_ctrl
    info: XIP instruction cache control register
    bits:
      - {b: 0, name: en, access: rw, rst: 0, info: "1: enable icache, 0: disable icache"}
      - {b: 1, name: flush, access: rwf, rst: 0, info: "Write 1 to flush the icache.
        This clears the tag memory, but the data memory retains its contents. Auto clear when completion"}
